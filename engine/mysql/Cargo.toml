[package]
name = "reylo-engine-mysql"
version = "0.0.0"
edition = "2021"
publish = false
description = "Reylo's analysis engine for MySQL: the server's prepare metadata and a sqlparser tree, the row-count proof and the nested JSON shapes, over the core's protocol."

[lib]
name = "reylo_engine_mysql"

[build-dependencies]
reylo-engine-build = { path = "../build-support" }

[dependencies]
reylo-engine-core = { path = "../core" }
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
