# sqlparser 0.63.0 (apache/datafusion-sqlparser-rs) as crates.io published it, without its
# development and optional dependencies: the MySQL engine's copy (README.md).

[package]
edition = "2021"
name = "sqlparser"
version = "0.63.0"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
build = false
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "LICENSE.TXT",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extensible SQL Lexer and Parser with support for ANSI SQL:2011"
homepage = "https://github.com/apache/datafusion-sqlparser-rs"
documentation = "https://docs.rs/sqlparser/"
publish = false
keywords = [
    "ansi",
    "sql",
    "lexer",
    "parser",
]
license = "Apache-2.0"
repository = "https://github.com/apache/datafusion-sqlparser-rs"

[features]
# Upstream's features, kept as names so the `cfg`s in the sources stay known. The engine builds
# `std` alone, and the optional dependencies behind the others are left out.
default = ["std"]
bigdecimal = []
derive-dialect = []
json_example = []
recursive-protection = ["std"]
serde = []
std = []
visitor = []

[lib]
name = "sqlparser"
path = "src/lib.rs"
# Upstream's tests are not in this copy, and its doc examples use the whole crate.
test = false
doctest = false

[dependencies.log]
version = "0.4"

[lints.rust]
unsafe_code = "forbid"
