[package]
name = "reylo-engine-postgres"
version = "0.0.0"
edition = "2021"
publish = false
description = "Reylo's analysis engine for Postgres: libpg_query's parse tree, the type registry, the expression rules, the row-count proof, the nested JSON shapes and the pgreylo handshake, over the core's protocol."

[lib]
name = "reylo_engine_postgres"

[build-dependencies]
reylo-engine-build = { path = "../build-support" }

[dependencies]
reylo-engine-core = { path = "../core" }
pg_query = "18.0"
prost = { version = "0.13", features = ["no-recursion-limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }

# `pg_query` 18.0 is not on crates.io yet: `../build.sh --prepare` fetches upstream's `pg-18` branch
# at a pinned commit and applies the patch in `vendor/` (WebAssembly, and how deeply a statement may
# nest) into `.patched/pg_query`; the `[patch]` that points cargo at the copy, and the release
# profile, are the workspace's (`../../Cargo.toml`). prost's recursion limit is lifted for the
# parse: libpg_query bounds the depth of what it hands over instead (`src/stack.rs`).
