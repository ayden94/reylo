[package]
name = "reylo-engine-sqlite"
version = "0.0.0"
edition = "2021"
publish = false
description = "Reylo's analysis engine for SQLite: SQLite's own resolved tree, from an amalgamation patched with the engine's hooks, the function tables and the row-count proof, over the core's protocol."

[lib]
name = "reylo_engine_sqlite"

[build-dependencies]
cc = "1"
reylo-engine-build = { path = "../build-support" }

[dependencies]
reylo-engine-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }

# The SQLite amalgamation is fetched into `.sqlite/` and patched with `csrc/patch-sqlite.py` by
# `../build.sh --prepare`; `build.rs` compiles it with `csrc/reylo_sqlite.c`.
