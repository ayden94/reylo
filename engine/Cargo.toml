[package]
name = "reylo-engine"
version = "0.0.0"
edition = "2021"
publish = false
description = "Reylo's SQL analysis engine: parse (pg_query for Postgres, SQLite's own resolved tree for SQLite), placeholder lexing, cardinality, expression nullability and nested JSON shapes, built to one WebAssembly artifact."

[lib]
name = "reylo_engine"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"

[dependencies]
pg_query = "18.0"
prost = { version = "0.13", features = ["no-recursion-limit"] }
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `pg_query` 18.0 is not on crates.io yet: `build.sh` fetches upstream's `pg-18` branch at a pinned
# commit and applies the patch in `vendor/` (WebAssembly, and how deeply a statement may nest); the
# `[patch]` that points cargo at the copy, and the release profile, are the workspace's
# (`../Cargo.toml`). prost's recursion limit is lifted for the parse: libpg_query bounds the depth
# of what it hands over instead (`src/stack.rs`). serde_json's is lifted for the tree SQLite hands
# over, which SQLite's own expression depth bounds.
