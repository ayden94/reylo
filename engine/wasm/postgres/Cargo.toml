[package]
name = "reylo-engine-postgres-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "The Postgres engine's WebAssembly artifact, `@reylosql/postgres`'s engine.wasm: the core's ABI over the Postgres crate (`engine/build.sh postgres`)."

[lib]
name = "reylo_engine_postgres_wasm"
crate-type = ["cdylib"]

[dependencies]
reylo-engine-core = { path = "../../core" }
reylo-engine-postgres = { path = "../../postgres" }
