[package]
name = "reylo-engine-all-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "The all-in-one artifact the loader runs until it loads each database's own package: every database, dispatched by the dialect a request names (`engine/reylo_engine.wasm`)."

[lib]
name = "reylo_engine_all_wasm"
crate-type = ["cdylib"]

[dependencies]
reylo-engine-core = { path = "../../core" }
reylo-engine-postgres = { path = "../../postgres" }
reylo-engine-sqlite = { path = "../../sqlite" }
reylo-engine-mysql = { path = "../../mysql" }
serde_json = "1"
