[package]
name = "reylo-engine-sqlite-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "The SQLite engine's WebAssembly artifact, `@reylosql/sqlite`'s engine.wasm: the core's ABI over the SQLite crate (`engine/build.sh sqlite`)."

[lib]
name = "reylo_engine_sqlite_wasm"
crate-type = ["cdylib"]

[dependencies]
reylo-engine-core = { path = "../../core" }
reylo-engine-sqlite = { path = "../../sqlite" }
