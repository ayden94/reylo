[package]
name = "reylo-engine-mysql-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "The MySQL engine's WebAssembly artifact, `@reylosql/mysql`'s engine.wasm: the core's ABI over the MySQL crate (`engine/build.sh mysql`)."

[lib]
name = "reylo_engine_mysql_wasm"
crate-type = ["cdylib"]

[dependencies]
reylo-engine-core = { path = "../../core" }
reylo-engine-mysql = { path = "../../mysql" }
