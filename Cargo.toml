# One Cargo workspace over both Rust crates: `engine/` (reylo-engine, the pure SQL analysis engine
# built to WebAssembly for the mapper and usable as an rlib), `framework/engine/` (the Reylo Framework
# binary, which consumes reylo-engine for its analysis) and `pg-extension/`. One lockfile,
# one `target/`.
#
# The `[patch]` is reylo-engine's: the crates.io `pg_query` 6.2.0 source with the WebAssembly patch
# from `engine/vendor/` applied by `engine/build.sh --prepare`, which also fetches the SQLite
# amalgamation `engine/build.rs` compiles. Run it once before any cargo command here; cargo refuses to
# resolve the workspace while the patched copy is missing.
[workspace]
resolver = "2"
members = ["engine", "framework/engine", "pg-extension", "oracle"]

[patch.crates-io]
pg_query = { path = "engine/.patched/pg_query" }

[profile.release]
# 3 rather than "s": 7 µs less CPU on a 50-row read (71 against 78 with the other fixes), for a
# Reylo Framework binary 31 % larger (20.3 to 26.6 MB stripped, measured 2026-10-03). The engine's wasm
# stays "s": engine/build.sh sets CARGO_PROFILE_RELEASE_OPT_LEVEL for its own build.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# `pg-extension/` hosts the engine inside a Postgres backend (`cargo build -p pgreylo --profile pg`).
# There a panic has to unwind to the FFI boundary and come back as an SQL error; an abort would
# take the server down with it. Speed over size: the library is loaded once per backend.
[profile.pg]
inherits = "release"
panic = "unwind"
opt-level = 2
lto = "thin"
codegen-units = 16

[profile.dev]
# libpg_query is large; keep dev builds tolerable.
debug = 1
