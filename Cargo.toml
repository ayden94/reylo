# One Cargo workspace over every Rust crate: the engine (`engine/`: `reylo-engine-core`, what every
# database shares; `reylo-engine-postgres`, `reylo-engine-sqlite` and `reylo-engine-mysql`, one per
# database; `reylo-engine-build`, their build scripts' source hash; and under `engine/wasm/` one
# entry crate per database that builds its WebAssembly artifact), `framework/engine/` (the Reylo
# Framework binary, which links the core, Postgres and SQLite crates), `pg-extension/` (`pgreylo`,
# the core and Postgres) and `oracle/` (every database). One lockfile, one `target/`.
#
# The `[patch]` is the Postgres crate's: `pg_query` 18.0.0, the Postgres 18 parser, which is
# upstream's `pg-18` branch at a pinned commit until crates.io has it, with the patch from
# `engine/postgres/vendor/` (WebAssembly, and how deeply a statement may nest) applied by
# `engine/build.sh --prepare`, which also fetches the SQLite amalgamation `engine/sqlite/build.rs`
# compiles. Run it once before any cargo command here; cargo refuses to resolve the workspace while
# the patched copy is missing.
[workspace]
resolver = "2"
members = [
  "engine/build-support",
  "engine/core",
  "engine/postgres",
  "engine/sqlite",
  "engine/mysql",
  "engine/wasm/postgres",
  "engine/wasm/sqlite",
  "engine/wasm/mysql",
  "framework/engine",
  "pg-extension",
  "oracle",
]

[patch.crates-io]
pg_query = { path = "engine/postgres/.patched/pg_query" }

[profile.release]
# 3 rather than "s": 7 µs less CPU on a 50-row read (71 against 78 with the other fixes), for a
# Reylo Framework binary 31 % larger (20.3 to 26.6 MB stripped, measured 2026-10-03). The engine's wasm
# stays "s" and without LTO: engine/build.sh sets CARGO_PROFILE_RELEASE_OPT_LEVEL and _LTO for its own
# build.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# `pg-extension/` hosts the engine inside a Postgres backend (`cargo build -p pgreylo --profile pg`).
# There a panic has to unwind to the FFI boundary and come back as an SQL error; an abort would
# take the server down with it. Speed over size: the library is loaded once per backend.
[profile.pg]
inherits = "release"
panic = "unwind"
opt-level = 2
lto = "thin"
codegen-units = 16

[profile.dev]
# libpg_query is large; keep dev builds tolerable.
debug = 1
